
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Prank Wallpaper APK
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем исходники проекта
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Устанавливаем Java
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Находим Android SDK
      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # 4. Принимаем лицензии Android SDK
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e
          set +o pipefail

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

          SDK_STATUS=${PIPESTATUS[1]}

          if [ "$SDK_STATUS" -ne 0 ]; then
            echo "SDK license acceptance failed with code $SDK_STATUS"
            exit "$SDK_STATUS"
          fi

          echo "Android SDK licenses accepted."

      # 5. Устанавливаем необходимые компоненты
      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools"

      # 6. Настраиваем Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 7. Собираем APK
      - name: Build APK
        run: gradle --no-daemon assembleDebug

      # 8. Проверяем наличие APK
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created!"
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      # 9. Загружаем APK в Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrankWallpaper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
